# Model Hyperparameters and Specifications for Raphael

prophet:
  growth: "linear"
  yearly_seasonality: true
  weekly_seasonality: true
  daily_seasonality: false
  seasonality_mode: "additive"
  country_holidays: "US"
  interval_widths: [0.80, 0.95]
  mcmc_samples: 0
  n_changepoints: 25
  changepoint_prior_scale: 0.05
  seasonality_prior_scale: 10.0
  holidays_prior_scale: 10.0
  clip_lower_bound: 0.0

lead_time_rf:
  n_estimators: 100
  max_depth: null
  min_samples_split: 5
  min_samples_leaf: 2
  random_state: 42
  n_jobs: -1
  features:
    - "material"
    - "area"
    - "order_quantity"
    - "month"
    - "is_holiday_season" # Nov-Dec indicator
    - "dayofweek"
    - "quarter"

baselines:
  naive:
    strategy: "last_observed"
  seasonal_naive:
    seasonality_period: 7 # 7-day weekly cycle
